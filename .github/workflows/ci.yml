name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Secret scan
        run: |
          if git grep -nE '[0-9]{8,}:AA[A-Za-z0-9_-]{30,}' -- . ':!*.yml'; then
            echo "::error::possible Telegram bot token committed"
            exit 1
          fi
